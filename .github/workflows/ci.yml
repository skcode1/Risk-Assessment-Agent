name: Cyber Risk Orchestration Engine CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --prefer-binary ruff mypy setuptools
          pip install --prefer-binary -r requirements.txt

      - name: Run Ruff Check
        run: |
          cd backend
          ruff check app/

      - name: Run Ruff Format
        run: |
          cd backend
          ruff format --check app/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --prefer-binary setuptools>=68.0.0 pytest pytest-asyncio pytest-mock
          pip install --prefer-binary -r requirements.txt

      - name: Run unit tests
        env:
          JWT_SECRET_KEY: "test-secret-key-for-ci-testing-only-32-chars"
          ENVIRONMENT: "production"
          OTEL_SDK_DISABLED: "true"
        run: |
          cd backend
          pytest tests/unit/ -v --no-cov

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: risk_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d risk_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --prefer-binary setuptools>=68.0.0 pytest pytest-asyncio pytest-mock
          pip install --prefer-binary -r requirements.txt

      - name: Run integration tests
        env:
          JWT_SECRET_KEY: "test-secret-key-for-ci-testing-only-32-chars"
          ENVIRONMENT: "production"
          OTEL_SDK_DISABLED: "true"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/risk_engine"
          REDIS_URL: "redis://localhost:6379/0"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd backend
          pytest tests/integration/ -v --no-cov

security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: risk_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d risk_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --prefer-binary setuptools>=68.0.0 pytest pytest-asyncio alembic
          pip install --prefer-binary -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/risk_engine"
        run: |
          cd backend
          alembic upgrade head

      - name: Run security tests
        env:
          JWT_SECRET_KEY: "test-secret-key-for-ci-testing-only-32-chars"
          ENVIRONMENT: "production"
          OTEL_SDK_DISABLED: "true"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/risk_engine"
          REDIS_URL: "redis://localhost:6379/0"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd backend
          pytest tests/security/ -v --no-cov